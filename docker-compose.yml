services:
  api:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://commerce:commerce@postgres:5432/commerce
      STRIPE_API_URL: http://stripe-mock:12111
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - postgres
      - stripe-mock
      - rabbitmq

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  stripe-mock:
    image: stripe/stripe-mock:v0.206.0
    ports:
      - '12111:12111'

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

volumes:
  pgdata:
  rabbitmqdata:
