name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce
          POSTGRES_DB: commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports:
          - 12111:12111
    env:
      PORT: 3000
      DATABASE_URL: postgresql://commerce:commerce@localhost:5432/commerce
      STRIPE_SECRET_KEY: sk_test_123
      STRIPE_API_URL: http://localhost:12111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run migrate:deploy
      - run: npm run test:e2e
